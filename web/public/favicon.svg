<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d78e"/>
      <stop offset="50%" stop-color="#d6a85f"/>
      <stop offset="100%" stop-color="#ab7a2f"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0a0a0a"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.9"/>
  
  <!-- Crossed Barber Scissors (Left blade to Right handle) -->
  <path d="M19 16 C22 23 27 28 32 32 L43 43" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Finger loop Right -->
  <circle cx="46.5" cy="46.5" r="5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Crossed Barber Scissors (Right blade to Left handle) -->
  <path d="M45 16 C42 23 37 28 32 32 L21 43" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Finger loop Left -->
  <circle cx="17.5" cy="46.5" r="5" fill="none" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Center Pivot Screw -->
  <circle cx="32" cy="32" r="2.8" fill="#d6a85f"/>
  <circle cx="32" cy="32" r="1.2" fill="#0a0a0a"/>

  <!-- Barber Comb Spine & Teeth at Top -->
  <path d="M22 17.5 L42 17.5" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <line x1="24.5" y1="17.5" x2="24.5" y2="21.5" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="28.5" y1="17.5" x2="28.5" y2="21.5" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="32" y1="17.5" x2="32" y2="22.5" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="35.5" y1="17.5" x2="35.5" y2="21.5" stroke="url(#gold)" stroke-width="1.2"/>
  <line x1="39.5" y1="17.5" x2="39.5" y2="21.5" stroke="url(#gold)" stroke-width="1.2"/>
</svg>
